<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГОСТ-форматтер</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full">
      <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">🎓 ГОСТ-Форматтер</h1>
      <p class="text-center text-gray-500 mb-6">Загрузи .docx и получи работу по ГОСТу за секунды</p>

      <form id="uploadForm" class="space-y-4">
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition-colors">
          <input type="file" id="fileInput" accept=".docx" required class="hidden">
          <label for="fileInput" class="cursor-pointer">
            <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
              <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <p class="mt-2 text-sm text-gray-600" id="fileName">Нажми для выбора файла .docx</p>
          </label>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition-colors disabled:bg-gray-400">
            Оформить по ГОСТ
        </button>
      </form>

      <div id="status" class="mt-4 text-center text-sm hidden"></div>
    </div>

    <script>
      const fileInput = document.getElementById('fileInput');
      const fileName = document.getElementById('fileName');
      const form = document.getElementById('uploadForm');
      const submitBtn = document.getElementById('submitBtn');
      const status = document.getElementById('status');

      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            fileName.textContent = e.target.files[0].name;
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const file = fileInput.files[0];
        if (!file) return;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Обрабатываю...';
        status.classList.remove('hidden');
        status.className = "mt-4 text-center text-sm text-blue-600";
        status.textContent = 'Применяем магию ГОСТ...';

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('/format', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error('Ошибка на сервере');

            // Получаем файл и скачиваем
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `GOST_${file.name}`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);

            status.className = "mt-4 text-center text-sm text-green-600 font-semibold";
            status.textContent = '✅ Готово! Файл скачан.';
        } catch (error) {
            status.className = "mt-4 text-center text-sm text-red-600";
            status.textContent = '❌ Ошибка: ' + error.message;
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Оформить по ГОСТ';
        }
      });
    </script>
  </body>
</html>
